<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>ETF Match: Open Graph image</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ad.css">
<style>
  /* The share card, 1200 x 630 at scale 1, exported to public/og.png
     (decision 40). Same tokens and type as the ads; no button, since a
     share card is not clickable in parts. */
  body { padding: 0; display: block; background: var(--bg); }
  .og {
    width: 1200px; height: 630px; padding: 56px 64px; overflow: hidden;
    display: flex; flex-direction: column; background: var(--bg);
  }
  .og .logo { font-size: 30px; }
  .og .copy { justify-content: center; }
  .og .header { font-size: 68px; line-height: 1.02; max-width: 1020px; }
  .og .sub { font-size: 30px; margin-top: 28px; padding-top: 20px; border-top-width: 4px; max-width: 900px; }
</style>
</head>
<body>
  <div class="og" role="img" aria-label="ETF Match. ETF z NYSE si tu většinou nekoupíte, stejný index v evropském fondu ano.">
    <div class="logo">ETF Match<span>.</span></div>
    <div class="copy">
      <p class="header">ETF z&nbsp;NYSE si tu většinou nekoupíte, stejný index v&nbsp;evropském fondu ano.</p>
      <p class="sub">Evropský fond místo VOO, SPY nebo IVV a&nbsp;kde ho koupit.</p>
    </div>
  </div>
</body>
</html>
